# Lint only first-party Swift. Tools/ is included: the diagnostic probe is real code that gets
# read when detection breaks, which is exactly when nobody wants to be deciphering it.
included:
  - Sources
  - Tests
  - Tools

excluded:
  - .build
  - .build-xcode

# Deliberate project conventions, not findings waived to reach green.
disabled_rules:
  # Trailing commas in collection literals are wanted: adding an element touches one line, which
  # keeps diffs and blame honest.
  - trailing_comma

# 120 is tight for this codebase's dense explanatory comments; 140 covers all but a handful of
# lines, which is a real bound rather than a rubber stamp.
line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_comments: false

# Names must be explicit. Short names are renamed rather than accommodated.
identifier_name:
  min_length: 3
  max_length: 50
  excluded:
    - id
    - to

type_name:
  min_length: 3
  max_length: 50
