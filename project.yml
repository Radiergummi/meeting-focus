name: MeetingFocus
options:
  bundleIdPrefix: me.mazetti
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: TH593VRB6W
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MeetingFocusCore:
    type: framework
    platform: macOS
    sources: [Sources/MeetingFocusCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.mazetti.meetingfocus.core
        ENABLE_HARDENED_RUNTIME: YES
  MeetingFocusCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/MeetingFocusCoreTests]
    dependencies:
      - target: MeetingFocusCore
  MeetingFocus:
    type: application
    platform: macOS
    sources:
      - Sources/MeetingFocusApp
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: MeetingFocusCore
        embed: true
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.mazetti.meetingfocus
        PRODUCT_NAME: MeetingFocus
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        # An explicit Info.plist rather than INFOPLIST_KEY_* settings: those only support Apple's
        # own known keys, and silently drop third-party ones such as Sparkle's SU* family.
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Sources/MeetingFocusApp/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Driving Shortcuts raises an Automation prompt attributed to this app; without a usage
        # description macOS turns that into a silent denial.
        NSAppleEventsUsageDescription: MeetingFocus runs the Shortcuts you configure when a meeting starts or ends.
        # Auto-update feed. Repoint this one value to move the appcast.
        SUFeedURL: https://meetingfocus.mazetti.me/appcast.xml
        SUPublicEDKey: PF6+rOJ1fFGZkt/v+OtImnW0UyQvGlRvafdlDWPusOM=
        SUEnableAutomaticChecks: true
  axprobe:
    type: tool
    platform: macOS
    sources: [Sources/axprobe]
    settings:
      base:
        PRODUCT_NAME: axprobe
schemes:
  MeetingFocus:
    build:
      targets:
        MeetingFocus: all
    run:
      config: Debug
  axprobe:
    build:
      targets:
        axprobe: all
