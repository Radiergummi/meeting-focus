name: MeetingFocus
options:
  bundleIdPrefix: me.mazetti
  developmentLanguage: en
  knownRegions:
    - en
    - de
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  # The core is a local SwiftPM package rather than an Xcode framework target, so `swift test` can
  # run the suite without a test host. See Package.swift.
  MeetingFocusCore:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    # XcodeGen's project-level default is 5.0. Set it here so a target added without its own
    # override cannot silently compile in Swift 5 mode.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: TH593VRB6W
    # Required for notarization; a signature without a secure timestamp is rejected.
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "1"
    # Build provenance. Defaults describe a local build honestly; the release workflow overrides
    # them on the xcodebuild command line so a released bundle names the commit and public build
    # log it came from. A binary that cannot say where it came from cannot be checked.
    MF_BUILD_COMMIT: local
    MF_BUILD_RUN_URL: ""
    # Whether Sparkle is allowed to check on its own. Substituted into SUEnableAutomaticChecks
    # below rather than written there literally, so Debug can turn it off. Sparkle installs into
    # the *running* bundle, so an automatic check accepted on a local build replaces that build
    # with the released one — a Developer ID binary standing where an Apple Development one did.
    # That is a different code requirement, and TCC pins the requirement it granted against, so
    # the app's Accessibility permission silently stops applying. The menu item still works; only
    # the unprompted check is off.
    MF_AUTOMATIC_UPDATE_CHECKS: "YES"
  configs:
    Debug:
      MF_AUTOMATIC_UPDATE_CHECKS: "NO"

targets:
  MeetingFocus:
    type: application
    platform: macOS
    sources:
      - Sources/MeetingFocusApp
      - path: Resources
        buildPhase: resources
      # An Icon Composer bundle, compiled by actool into Assets.car. `type: file` is required:
      # XcodeGen predates the .icon extension and would otherwise descend into the bundle and add
      # its PNGs as loose resources, which produces no app icon at all.
      - path: Icons/MeetingFocus.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: MeetingFocusCore
        product: MeetingFocusCore
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.mazetti.meetingfocus
        PRODUCT_NAME: MeetingFocus
        # Names the Icon Composer bundle above. actool writes the matching CFBundleIconName into a
        # partial plist that is merged with the hand-authored Info.plist, so the key is not repeated
        # there — it would go stale the moment the icon is renamed.
        ASSETCATALOG_COMPILER_APPICON_NAME: MeetingFocus
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        # An explicit Info.plist rather than INFOPLIST_KEY_* settings: those only support Apple's
        # own known keys, and silently drop third-party ones such as Sparkle's SU* family.
        GENERATE_INFOPLIST_FILE: NO
        # OFF deliberately, for a hand-authored String Catalog: compiler string extraction rewrites
        # the *source* Localizable.xcstrings on every build, reordering keys and resetting states.
        # The catalog is still compiled into the app; keys are reconciled by the xcstrings tool.
        SWIFT_EMIT_LOC_STRINGS: "NO"
        # OFF for the same reason, and not optional: XcodeGen's setting presets turn symbol
        # generation on, and generated symbols cannot coexist with a hand-authored catalog. Keys
        # that differ only by case or trailing punctuation derive the same Swift symbol, which is a
        # hard build error. Deduplicating is not the fix — a key must match its Swift literal
        # character-for-character or the translation silently falls back to the development language.
        STRING_CATALOG_GENERATE_SYMBOLS: "NO"
    info:
      path: Sources/MeetingFocusApp/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        CFBundleLocalizations:
          - en
          - de
        # Driving Shortcuts raises an Automation prompt attributed to this app; without a usage
        # description macOS turns that into a silent denial.
        NSAppleEventsUsageDescription: MeetingFocus runs the Shortcuts you configure when a meeting starts or ends.
        # Receiving Apple Events, which is the opposite direction from NSAppleEventsUsageDescription
        # above — that one covers this app *sending* them to Shortcuts.
        NSAppleScriptEnabled: true
        OSAScriptingDefinition: MeetingFocus.sdef
        # Auto-update feed. Repoint this one value to move the appcast.
        SUFeedURL: https://meetingfocus.mazetti.me/appcast.xml
        SUPublicEDKey: PF6+rOJ1fFGZkt/v+OtImnW0UyQvGlRvafdlDWPusOM=
        SUEnableAutomaticChecks: $(MF_AUTOMATIC_UPDATE_CHECKS)
        MFBuildCommit: $(MF_BUILD_COMMIT)
        MFBuildRunURL: $(MF_BUILD_RUN_URL)
schemes:
  MeetingFocus:
    build:
      targets:
        MeetingFocus: all
    run:
      config: Debug
